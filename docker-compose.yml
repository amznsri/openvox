# OpenVox — local-first deployment.
#
# Quickstart:
#   cp .env.example .env
#   docker compose up --build
#
# Then open http://localhost:3000

services:
  # ── Core Python voice pipeline (FastAPI + WebSockets) ────────────────────
  core:
    build:
      context: ./packages/core
      dockerfile: Dockerfile
    container_name: openvox-core
    ports:
      - "${CORE_PORT:-8000}:8000"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # TLS: if you're on a corporate network with TLS inspection (Zscaler etc.)
      # either drop the corporate root PEM into ./docker/extra-ca.pem or set
      # OPENVOX_INSECURE_TLS=true in .env to skip verification entirely.
      - OPENVOX_INSECURE_TLS=${OPENVOX_INSECURE_TLS:-false}
      - OPENVOX_EXTRA_CA_FILE=/etc/openvox/extra-ca.pem
      # Hard-coded: these hostnames refer to Docker service names and must not
      # be overridden by a developer's `.env` (which usually points at localhost
      # for running services outside Docker).
      - DATABASE_URL=postgresql+asyncpg://openvox:openvox@postgres:5432/openvox
      - REDIS_URL=redis://redis:6379
      # BytePlus
      - BYTEPLUS_LLM_API_KEY=${BYTEPLUS_LLM_API_KEY:-}
      - BYTEPLUS_LLM_ENDPOINT_ID=${BYTEPLUS_LLM_ENDPOINT_ID:-}
      - BYTEPLUS_LLM_MODEL=${BYTEPLUS_LLM_MODEL:-seed-2-0-pro-260328}
      - BYTEPLUS_LLM_REGION=${BYTEPLUS_LLM_REGION:-ap-southeast}
      - BYTEPLUS_EMBEDDING_MODEL=${BYTEPLUS_EMBEDDING_MODEL:-doubao-embedding-large-text-240915}
      - BYTEPLUS_RAG_ACCESS_KEY=${BYTEPLUS_RAG_ACCESS_KEY:-}
      - BYTEPLUS_RAG_SECRET_KEY=${BYTEPLUS_RAG_SECRET_KEY:-}
      - BYTEPLUS_RAG_COLLECTION=${BYTEPLUS_RAG_COLLECTION:-}
      - BYTEPLUS_RAG_ENDPOINT=${BYTEPLUS_RAG_ENDPOINT:-https://api-knowledgebase.mlp.cn-hongkong.bytepluses.com}
      - BYTEPLUS_RAG_REGION=${BYTEPLUS_RAG_REGION:-cn-hongkong}
      - BYTEPLUS_RAG_SERVICE=${BYTEPLUS_RAG_SERVICE:-air}
      - BYTEPLUS_VOICE_API_KEY=${BYTEPLUS_VOICE_API_KEY:-}
      - BYTEPLUS_TTS_DEFAULT_VOICE=${BYTEPLUS_TTS_DEFAULT_VOICE:-en_male_tim_uranus_bigtts}
      - BYTEPLUS_RTC_APP_ID=${BYTEPLUS_RTC_APP_ID:-}
      - BYTEPLUS_RTC_APP_KEY=${BYTEPLUS_RTC_APP_KEY:-}
      # Other LLMs
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Other STT/TTS
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_DEFAULT_VOICE_ID=${ELEVENLABS_DEFAULT_VOICE_ID:-}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY:-}
      - CARTESIA_DEFAULT_VOICE_ID=${CARTESIA_DEFAULT_VOICE_ID:-}
      - OPENAI_TTS_DEFAULT_VOICE=${OPENAI_TTS_DEFAULT_VOICE:-alloy}
      # Telephony
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Storage
      - STORAGE_BACKEND=${STORAGE_BACKEND:-byteplus_tos}
      - STORAGE_LOCAL_PATH=${STORAGE_LOCAL_PATH:-/data/storage}
      - BYTEPLUS_TOS_ACCESS_KEY=${BYTEPLUS_TOS_ACCESS_KEY:-}
      - BYTEPLUS_TOS_SECRET_KEY=${BYTEPLUS_TOS_SECRET_KEY:-}
      - BYTEPLUS_TOS_ENDPOINT=${BYTEPLUS_TOS_ENDPOINT:-tos-ap-southeast-1.bytepluses.com}
      - BYTEPLUS_TOS_REGION=${BYTEPLUS_TOS_REGION:-ap-southeast-1}
      - BYTEPLUS_TOS_BUCKET=${BYTEPLUS_TOS_BUCKET:-openvox-media}
      - S3_BUCKET=${S3_BUCKET:-openvox-media}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      # Routing / privacy
      - ROUTING_STRATEGY=${ROUTING_STRATEGY:-latency}
      - ROUTING_FALLBACK_ENABLED=${ROUTING_FALLBACK_ENABLED:-true}
      - LATENCY_BUDGET_MS=${LATENCY_BUDGET_MS:-300}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-30}
      - ENABLE_TRANSCRIPT_STORAGE=${ENABLE_TRANSCRIPT_STORAGE:-true}
      - ENABLE_AUDIO_STORAGE=${ENABLE_AUDIO_STORAGE:-false}
      - PII_MASKING_ENABLED=${PII_MASKING_ENABLED:-true}
    volumes:
      - openvox-data:/data
      # If you have a corporate root PEM, drop it at ./docker/extra-ca.pem and
      # the core service will trust it on next restart.
      - ./docker/extra-ca.pem:/etc/openvox/extra-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js gateway: REST + WS bridge + telephony webhooks ───────────────
  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: openvox-server
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=3001
      - CORE_API_URL=http://core:8000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - OPENVOX_AUTH=${OPENVOX_AUTH:-disabled}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js dashboard ────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: openvox-dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
      - NEXT_PUBLIC_OPENVOX_AUTH=${OPENVOX_AUTH:-disabled}
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

  # ── Postgres ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: openvox-postgres
    environment:
      POSTGRES_USER: openvox
      POSTGRES_PASSWORD: openvox
      POSTGRES_DB: openvox
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvox"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: openvox-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── ngrok tunnel (optional, opt-in via --profile tunnel) ─────────────────
  # Exposes the gateway (server:3001) on a public HTTPS URL so external
  # telephony providers (Twilio, Telegram, WeCom, Lark) can reach our
  # webhooks. The core/app calls ngrok's local API (http://ngrok:4040) to
  # discover the current public URL — see /api/v1/telephony/public_url.
  #
  # Setup:
  #   1. Free signup at https://ngrok.com → Dashboard → Your Authtoken
  #   2. Add NGROK_AUTHTOKEN=2abc... to your .env
  #   3. `docker compose --profile tunnel up`
  #
  # Without --profile tunnel this service is inert, so non-telephony users
  # don't pay any startup cost for the dependency.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: openvox-ngrok
    command: http server:3001 --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"   # local inspector UI + JSON API at /api/tunnels
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped
    profiles:
      - tunnel

  # ── WhatsApp Personal bridge (optional, opt-in via --profile whatsapp) ────
  # Node service wrapping whatsapp-web.js for personal-account WhatsApp.
  # Heavy (~600 MB image due to bundled Chromium + Puppeteer), which is why
  # it's opt-in. The core service talks to it over HTTP at
  # http://whatsapp-bridge:4100.
  #
  # IMPORTANT — Meta TOS:
  #   whatsapp-web.js uses the unofficial WhatsApp Web protocol. Accounts
  #   using it can be banned without warning. Use a TEST WhatsApp number,
  #   never a primary account. For production WhatsApp, use the official
  #   Business API (already supported via /api/v1/telephony/whatsapp/*).
  #
  # Setup:
  #   1. `docker compose --profile whatsapp up -d whatsapp-bridge`
  #   2. In the dashboard, open an agent → Channels → WhatsApp Personal → Connect.
  #   3. Scan the QR code from your test phone (Linked Devices in WhatsApp).
  whatsapp-bridge:
    build:
      context: ./packages/whatsapp_personal_bridge
    image: openvox-whatsapp-personal-bridge
    container_name: openvox-whatsapp-bridge
    environment:
      PORT: "4100"
      PYTHON_WEBHOOK: "http://core:8000/api/v1/telephony/whatsapp_personal/inbound"
      SESSIONS_DIR: "/data/sessions"
    volumes:
      - whatsapp-sessions:/data/sessions
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped
    profiles:
      - whatsapp

volumes:
  postgres-data:
  redis-data:
  openvox-data:
  whatsapp-sessions:
