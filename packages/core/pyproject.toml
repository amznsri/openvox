[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openvox-core"
version = "0.1.0"
description = "OpenVox — local-first voice agent platform core"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "OpenVox Contributors" }]
keywords = ["voice", "agent", "ai", "tts", "stt", "rtc", "byteplus"]

dependencies = [
  # Web
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "websockets>=13.0",
  "python-multipart>=0.0.12",
  # Settings / validation
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  # Database
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  # Cache / queue
  "redis[hiredis]>=5.1.0",
  # HTTP
  "httpx>=0.27.0",
  "certifi>=2024.8.30",
  "aiofiles>=24.1.0",
  # Audio / numerics
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  # Silero VAD — sub-100 ms server-side voice activity detection. Brings
  # in torch (CPU-only wheel is ~200 MB but no GPU runtime needed); the
  # silero-vad package vendors the ONNX model so no network fetch at
  # runtime. If you really want a lighter image, set
  # OPENVOX_DISABLE_SILERO=1 and the provider will report unavailable
  # without trying to import torch.
  "silero-vad>=5.1.0",
  # Audio decoding for the Audio Analyzer file-upload path. Requires the
  # ffmpeg binary, which is installed in the core Dockerfile.
  "pydub>=0.25.1",
  # PDF text extraction for the Document Q&A agent.
  "pypdf>=4.3.0",
  # Auth
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "authlib>=1.3.0",
  # Storage
  "boto3>=1.35.0",
  "tos>=2.7.0",
  "google-cloud-storage>=2.18.0",
  "oss2>=2.18.0",
  # Logging / observability
  "structlog>=24.4.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  # Telephony
  "twilio>=9.3.0",
  # Utility
  "tenacity>=9.0.0",
  "orjson>=3.10.0",
  # Scheduling — cron/interval/once triggers, async runner.
  "apscheduler>=3.10.4",
  # Model Context Protocol — connect to external tool servers.
  "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]
local-stt = [
  # Optional: local Whisper inference. Heavy — opt-in.
  "openai-whisper>=20240930",
]

[project.scripts]
openvox-core = "openvox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openvox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
