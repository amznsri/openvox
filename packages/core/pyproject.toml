[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openvox-core"
version = "0.1.1"
description = "Local-first, open-source voice agent platform — install with pip, run as a daemon, no Docker required."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "OpenVox Contributors" }]
keywords = ["voice", "agent", "ai", "tts", "stt", "rtc", "telegram", "whatsapp", "twilio"]
classifiers = [
  # Maturity — bump to "5 - Production/Stable" after the v1 PyPI release.
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  # OS support: CLI mode works on all three; Docker mode is Linux-only.
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # Web
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "websockets>=13.0",
  "python-multipart>=0.0.12",
  # Settings / validation
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  # Database
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  # Cache / queue
  "redis[hiredis]>=5.1.0",
  # HTTP
  "httpx>=0.27.0",
  "certifi>=2024.8.30",
  "aiofiles>=24.1.0",
  # Audio / numerics
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  # Silero VAD — sub-100 ms server-side voice activity detection. Brings
  # in torch (CPU-only wheel is ~200 MB but no GPU runtime needed); the
  # silero-vad package vendors the ONNX model so no network fetch at
  # runtime. If you really want a lighter image, set
  # OPENVOX_DISABLE_SILERO=1 and the provider will report unavailable
  # without trying to import torch.
  "silero-vad>=5.1.0",
  # Audio decoding for the Audio Analyzer file-upload path. Requires the
  # ffmpeg binary, which is installed in the core Dockerfile.
  "pydub>=0.25.1",
  # PDF text extraction for the Document Q&A agent.
  "pypdf>=4.3.0",
  # Auth
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "authlib>=1.3.0",
  # Storage
  "boto3>=1.35.0",
  "tos>=2.7.0",
  "google-cloud-storage>=2.18.0",
  "oss2>=2.18.0",
  # Logging / observability
  "structlog>=24.4.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  # Telephony
  "twilio>=9.3.0",
  # Utility
  "tenacity>=9.0.0",
  "orjson>=3.10.0",
  # Scheduling — cron/interval/once triggers, async runner.
  "apscheduler>=3.10.4",
  # Model Context Protocol — connect to external tool servers.
  "mcp>=1.2.0",
  # Hot-reload of user skills in ~/.openvox/skills/ — small async-friendly
  # wrapper around inotify/FSEvents/ReadDirectoryChangesW.
  "watchfiles>=0.24.0",
  # CLI framework — backs `openvox version`/`info`/`run`. Click-based,
  # type-hint-driven, plays nicely with the rest of our Python stack.
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]
local-stt = [
  # Optional: local Whisper inference. Heavy — opt-in.
  "openai-whisper>=20240930",
]
# Postgres / production-database operators. Today asyncpg ships in the
# base install so the production path "just works", but reserving the
# extras name now means `pip install openvox-core[postgres]` is a
# stable command across future deps-shuffles (e.g. if we move
# asyncpg/alembic out of the base install in a slim-down).
postgres = []
# WhatsApp Personal channel. The QR-scan adapter is a Node sidecar
# (whatsapp-web.js), launched via Docker compose profile=whatsapp; no
# Python deps to add today. The extras key is reserved here so
# `pip install openvox-core[whatsapp]` is the documented install path
# once the Node sidecar gets wrapped in a Python launcher.
whatsapp = []

[project.urls]
# Surfaced on the PyPI listing sidebar. Keep these stable — PyPI doesn't
# rewrite history, so old releases that point at dead URLs stay dead.
Homepage = "https://github.com/amznsri/openvox"
Documentation = "https://github.com/amznsri/openvox/tree/main/docs"
Repository = "https://github.com/amznsri/openvox"
Issues = "https://github.com/amznsri/openvox/issues"
Changelog = "https://github.com/amznsri/openvox/blob/main/docs/SESSION_LOG.md"

[project.scripts]
# Phase 1 PR-2: renamed openvox-core → openvox. This is the user-facing
# binary name that `pip install openvox` (or `pip install openvox-core`)
# exposes on the user's PATH. Matches the project name people will
# search for.
openvox = "openvox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openvox"]

# Force-include of Windows daemon helper. nssm.exe is a tiny (~310 KB)
# BSD-licensed Windows service wrapper that openvox/cli/daemon/
# windows_service.py shells out to. It's not committed to the repo yet
# (the binary lands in Phase 4 PR-3 release-pipeline work along with the
# checksum verification step). When that PR lands, drop the .exe at
# `openvox/cli/daemon/_bin/nssm.exe` and uncomment the include block
# below — hatch will then ship it inside the wheel so a Windows user
# never has to `choco install nssm` separately.
#
# [tool.hatch.build.targets.wheel.force-include]
# "openvox/cli/daemon/_bin/nssm.exe" = "openvox/cli/daemon/_bin/nssm.exe"

[tool.hatch.build.targets.sdist]
# Whitelist the things we need in the source distribution and exclude
# transient build artefacts. Without this, hatch picks everything up.
include = [
  "/openvox",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]
exclude = [
  "__pycache__",
  "*.pyc",
  ".pytest_cache",
  "/tests/.openvox",  # tmp test data dir if it ever leaks
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
