[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openvox-sdk"
version = "0.1.0"
description = "Python SDK for OpenVox — voice agents from your code."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "websockets>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["openvox_sdk"]
