# Run pytest on every PR + push to main.
#
# This is the Phase 1 stub. Phase 6 (per PLANNING_SESSION17.md) expands
# this to a multi-OS / multi-Python-version matrix. For now: just
# Ubuntu + Python 3.12 on the Phase-1 unit suite, so a PR that breaks
# tests can't merge silently.
#
# Coverage threshold (60%) is enforced via the pytest-cov plugin +
# `fail_under = 60` in packages/core/pyproject.toml's
# [tool.coverage.report] block. The threshold is moderate by design
# — Phase 1's value is in catching the load-bearing paths
# (hydration, secrets, providers, setup skills), not chasing 100%
# of every thin HTTP wrapper.

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest + coverage (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install openvox-core in editable mode + dev deps
        # Editable install pulls in all runtime deps; .[dev] adds
        # pytest + pytest-cov + respx. The dashboard isn't needed
        # for unit tests, so no Node setup here.
        working-directory: packages/core
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        # --cov= uses [tool.coverage.run]'s source list.
        # --cov-report=term-missing surfaces uncovered lines in the
        # job log so contributors don't need to download the report.
        # --cov-fail-under uses [tool.coverage.report]'s fail_under.
        working-directory: packages/core
        run: |
          pytest --cov=openvox --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML as workflow artifact
        # Phase 6 will switch to Codecov. For now an XML artifact lets
        # contributors inspect coverage details from the run page.
        if: always()  # upload even on test failure for debugging
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: packages/core/coverage.xml
          retention-days: 14
